# Production. Every value comes from the environment — no defaults on purpose,
# so a missing credential fails the app at startup instead of silently using
# a development one.
spring:
  jpa:
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: WARN
    com.explorelk.destination: INFO
