# Local development. Defaults match docker-compose.yml so the app runs
# with no environment variables set at all.
spring:
  datasource:
    url: ${DESTINATION_DB_URL:jdbc:postgresql://localhost:5433/explorelk_destination}
    username: ${DESTINATION_DB_USERNAME:explorelk}
    password: ${DESTINATION_DB_PASSWORD:explorelk}

  # Seed content is a Flyway location, not a migration. It is added here and
  # nowhere else, so production never loads it — application.yml lists only
  # classpath:db/migration.
  flyway:
    locations: classpath:db/migration,classpath:db/seed

  jpa:
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops,beans,flyway
  endpoint:
    health:
      show-details: always

# http://localhost:8082/swagger-ui.html — generated from the controllers, so it
# cannot drift from them. SecurityConfig opens these two paths only when
# api-docs is enabled, which is only here.
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # Endpoints grouped the way the service is: public catalog first, admin
    # after, rather than alphabetically by controller class name.
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

logging:
  level:
    com.explorelk.destination: DEBUG
    org.flywaydb: INFO
    # Uncomment to watch the cache work: request the same destination twice and
    # the second one issues no SQL at all.
    # org.hibernate.SQL: DEBUG
