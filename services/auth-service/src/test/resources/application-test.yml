# Test profile. The database and Redis URLs are injected at runtime by
# TestContainers/@DynamicPropertySource — nothing here points at a real service.
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

  # No SMTP server in the suite. The mail sender is stubbed in the test context,
  # so this only has to be a host that never gets connected to.
  mail:
    host: localhost
    port: 1025

explorelk:
  # The signing keypair is generated by TestContainers and injected through
  # @DynamicPropertySource — never the developer's own keys/, which are
  # git-ignored and so absent on a fresh clone and in CI.

  events:
    # Off by default: only the Kafka test turns it on, and it does so with its
    # own broker. Leaving it enabled would make every other test wait five
    # seconds per write for a producer that has nowhere to send.
    enabled: false
    auth-events: explorelk.auth.events
    partitions: 1
    replicas: 1
    poll-interval-ms: 1000

  rate-limit:
    # ON, unlike most test settings. The limits are part of what the suite is
    # testing, and the per-test Redis flush in TestContainers keeps one class's
    # attempts from counting against the next.
    enabled: true
    # Higher than production: every MockMvc request comes from the same IP, so a
    # class with a dozen login tests would otherwise throttle itself and fail for
    # a reason that has nothing to do with what it asserts. The per-account
    # lockout below is the number the tests actually exercise.
    login-per-ip: 200
    login-window: 60s
    max-failed-logins: 5
    lock-duration: 15m
    email-requests: 3
    email-window: 15m

  super-admin:
    # Left blank. Tests create exactly the accounts they need, and a bootstrap
    # user appearing in every context would break the row counts the admin tests
    # assert on.
    email:
    password:

logging:
  level:
    root: WARN
    com.explorelk.auth: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
