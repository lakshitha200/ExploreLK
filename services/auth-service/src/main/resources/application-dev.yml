# Local development. Defaults match docker-compose.yml so the app runs
# with no environment variables set at all.
spring:
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/explorelk_auth}
    username: ${AUTH_DB_USERNAME:explorelk}
    password: ${AUTH_DB_PASSWORD:explorelk}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # MailHog. Nothing leaves the machine; read the inbox at http://localhost:8025
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  jpa:
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

explorelk:
  super-admin:
    # A known development account, so a fresh clone has someone who can reach the
    # admin endpoints. It still starts with must_change_password set, and these
    # values exist nowhere but this dev-only file.
    email: ${SUPER_ADMIN_EMAIL:superadmin@explorelk.local}
    password: ${SUPER_ADMIN_PASSWORD:ChangeMe_123}

# http://localhost:8081/swagger-ui.html — generated from the controllers, so it
# cannot drift from them. SecurityConfig opens these paths only when api-docs is
# enabled, which is only here.
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops,beans,flyway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.explorelk.auth: DEBUG
    org.flywaydb: INFO
    # NOTE: org.hibernate.orm.jdbc.bind at TRACE logs every JDBC bind parameter —
    # which in this service means email addresses and BCrypt hashes in plain text.
    # Left off deliberately. Turn it on for a single debugging session if you must,
    # then delete the log file:
    #   org.hibernate.orm.jdbc.bind: TRACE
