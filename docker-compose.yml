name: explorelk

services:

  # ── PostgreSQL ────────────────────────────────────────────────
  # One database per service. For the MVP they share a container;
  # each service gets its own database and never touches another's.
  postgres:
    # PostGIS, not plain postgres — the Destination Service needs the postgis
    # extension for "what is near here" queries. Superset of the base image.
    image: ${POSTGRES_IMAGE:-postgis/postgis:16-3.4}
    container_name: explorelk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-explorelk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-explorelk}
      POSTGRES_DB: ${POSTGRES_DB:-explorelk_auth}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when the data directory is empty — creates the databases the
      # other services own. Existing volumes are untouched; add those by hand.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-explorelk} -d ${POSTGRES_DB:-explorelk_auth}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────
  # Rate limiting, brute-force lockout, access-token denylist.
  # Never the source of truth — safe to wipe.
  redis:
    image: redis:7-alpine
    container_name: explorelk-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Kafka (KRaft mode — no ZooKeeper) ─────────────────────────
  # Single broker, acting as both controller and broker.
  kafka:
    image: apache/kafka:3.8.0
    container_name: explorelk-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      # INTERNAL name for container-to-container, EXTERNAL for your host machine.
      # Getting this wrong is the #1 cause of "connection refused" from a local app.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: explorelk-local-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── Kafka UI ──────────────────────────────────────────────────
  # http://localhost:8085 — watch events land on topics.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: explorelk-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: explorelk-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"

  # ── MailHog ───────────────────────────────────────────────────
  # Fake SMTP. Nothing leaves your machine.
  # SMTP on 1025, web inbox on http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: explorelk-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # ── Destination Service ───────────────────────────────────────
  # The catalog: destinations, attractions, categories, proximity search.
  # http://localhost:8082 — /swagger-ui.html in the dev profile.
  destination-service:
    build:
      context: ./services/destination-service
      dockerfile: Dockerfile
    image: explorelk/destination-service:latest
    container_name: explorelk-destination-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${DESTINATION_PROFILE:-dev}

      # Service names and INTERNAL ports here, never localhost: inside a
      # container localhost is the container itself. The published 5433/6379
      # ports are for processes on the host, and using them here is the
      # classic "connection refused" from an otherwise correct config.
      DESTINATION_DB_URL: jdbc:postgresql://postgres:5432/${DESTINATION_DB_NAME:-explorelk_destination}
      DESTINATION_DB_USERNAME: ${POSTGRES_USER:-explorelk}
      DESTINATION_DB_PASSWORD: ${POSTGRES_PASSWORD:-explorelk}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EVENTS_ENABLED: ${EVENTS_ENABLED:-true}

      # The Auth Service is not in this file yet, so the default reaches back to
      # one running on the host. Change it to http://auth-service:8081/... the
      # moment auth is containerised alongside this. Public catalog reads work
      # either way; only the admin endpoints need a verifiable token.
      AUTH_JWKS_URI: ${AUTH_JWKS_URI_INTERNAL:-http://host.docker.internal:8081/.well-known/jwks.json}
      JWT_ISSUER: ${JWT_ISSUER:-explorelk-auth}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    extra_hosts:
      # Lets the AUTH_JWKS_URI default above resolve on Linux, where
      # host.docker.internal is not built in the way it is on Desktop.
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Readiness, not liveness: the question is "can it serve traffic". Redis is
      # deliberately outside that group — the catalog answers every request
      # correctly with the cache down, so a restarting Redis must not mark this
      # container unhealthy. Defined in the Dockerfile too; repeated here so
      # `docker compose ps` reports it without depending on the image build.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 90s

volumes:
  postgres-data:
  kafka-data:
